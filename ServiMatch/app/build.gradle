plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")

if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def apiBaseUrl = localProperties.getProperty("API_BASE_URL", "")

android {
    namespace 'com.ispc.servimatch'
    compileSdk 33

    defaultConfig {
        applicationId "com.ispc.servimatch"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }
}


configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
                details.requested.name in [
                'kotlin-stdlib',
                'kotlin-stdlib-common',
                'kotlin-stdlib-jdk7',
                'kotlin-stdlib-jdk8'
        ]) {
            details.useVersion '1.8.10'
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'

    // Retrofit - conexión con la API Django
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // Testing - JUnit
    testImplementation 'junit:junit:4.13.2'

    // Testing - Mockito
    testImplementation 'org.mockito:mockito-core:5.18.0'

    // Testing - MockWebServer
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    // Testing - Android Architecture Components
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    // Testing - Espresso
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
